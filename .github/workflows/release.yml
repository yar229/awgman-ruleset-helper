name: Release extension

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute version and archive names
        id: ver
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "chrome=awg-ruleset-helper-$VERSION-chrome.zip" >> "$GITHUB_OUTPUT"
          echo "firefox=awg-ruleset-helper-$VERSION-firefox.zip" >> "$GITHUB_OUTPUT"

      - name: Build and stage manifests
        run: node build.mjs --version=${{ steps.ver.outputs.version }}

      - name: Zip chrome
        run: |
          cd dist/chrome
          zip -q -r "../${{ steps.ver.outputs.chrome }}" .

      - name: Zip firefox
        run: |
          cd dist/firefox
          zip -q -r "../${{ steps.ver.outputs.firefox }}" .

      - name: Validate archives
        run: |
          unzip -l "dist/${{ steps.ver.outputs.chrome }}" | grep "manifest.json"
          unzip -l "dist/${{ steps.ver.outputs.firefox }}" | grep "manifest.json"
          ls -la dist

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.ver.outputs.version }}
          files: |
            dist/${{ steps.ver.outputs.chrome }}
            dist/${{ steps.ver.outputs.firefox }}
          generate_release_notes: true