name: Release extension

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute version and archive name
        id: ver
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "archive=awg-ruleset-helper-$VERSION.zip" >> "$GITHUB_OUTPUT"

      - name: Package extension
        run: |
          set -euo pipefail
          mkdir -p dist/pkg
          cp -r manifest.json background.js lib popup editor icons README.md dist/pkg/
          cd dist/pkg
          zip -q -r "../${{ steps.ver.outputs.archive }}" .
          cd ..
          ls -la

      - name: Validate archive contents
        run: |
          unzip -l "dist/${{ steps.ver.outputs.archive }}" | grep "manifest.json"

      - name: Create release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.ver.outputs.version }}
          files: dist/${{ steps.ver.outputs.archive }}
          generate_release_notes: true