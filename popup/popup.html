<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AWG Rule-Set Helper</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1>AWG Rule-Set Helper</h1>
    <div class="head-actions">
      <button id="openEditorBtn" class="btn primary" type="button">Редактор</button>
      <button id="settingsToggle" class="link" type="button" aria-label="Настройки" title="Настройки">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </header>

  <div id="settingsPanel" class="card">
    <label>
      Base URL (API)
      <input id="baseUrl" type="text" placeholder="http://192.168.1.1:2222/api" spellcheck="false" />
    </label>
    <label>
      API Key
      <input id="apiKey" type="password" placeholder="Bearer-токен (если включена авторизация)" spellcheck="false" />
    </label>
    <label>
      Раздел API
      <select id="flavor">
        <option value="fakeip">FakeIP config (вкладка Rule sets)</option>
        <option value="router">Router (общий sing-box)</option>
      </select>
    </label>
    <label>
      Тег rule-set (только inline)
      <select id="ruleSetTag">
        <option value="">— нажмите «Обновить список» —</option>
      </select>
    </label>
    <label>
      Матчинг для добавления домена
      <select id="matcher">
        <option value="domain_suffix">domain_suffix (домен + поддомены)</option>
        <option value="domain">domain (только точный домен)</option>
      </select>
    </label>
    <label class="checkbox-label">
      <input id="stripWww" type="checkbox" />
      Убирать www из имени
    </label>
    <label>Игнорировать при подсчёте ошибок (домены из rule-set)</label>
    <div id="ignoreList" class="ignore-list"></div>
    <div class="row">
      <button id="refreshListBtn" class="btn" type="button">Обновить список</button>
      <button id="checkBtn" class="btn" type="button">Проверить</button>
    </div>
    <div class="row">
      <button id="saveBtn" class="btn primary" type="button">Сохранить</button>
    </div>
    <div id="settingsStatus" class="status" hidden></div>
    <div id="checkResult" class="check-result" hidden></div>
  </div>

  <main>
    <div class="card">
      <h2>Быстрое добавление домена</h2>
      <label>
        Домен или URL
        <input id="domainInput" type="text" placeholder="example.com" spellcheck="false" />
      </label>
      <button id="addBtn" class="btn primary block" type="button">Добавить в rule-set</button>
    </div>

    <div class="card">
      <h2>Неудачные запросы</h2>
      <div class="hint" id="failedPageHint" hidden></div>
      <ul id="failedList" class="checklist"></ul>
      <div class="row">
        <button id="addSelectedBtn" class="btn primary" type="button">Добавить выбранные</button>
        <button id="clearFailedBtn" class="btn ghost" type="button">Очистить</button>
      </div>
    </div>

    <div class="card">
      <h2>Добавленные домены</h2>
      <ul id="history" class="history"></ul>
      <button id="clearBtn" class="btn ghost" type="button">Очистить историю</button>
    </div>

    <div id="status" class="status" hidden></div>
  </main>

  <footer>Подсказка: ПКМ по странице или ссылке — «Добавить домен в rule-set AWG». Полноценный редактор содержимого — кнопка «Редактор».</footer>

  <script src="../lib/api.js"></script>
  <script src="popup.js"></script>
</body>
</html>
